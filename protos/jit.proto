syntax = "proto3";

package dataform;

import "protos/execution.proto";
import "protos/struct.proto";

option java_package = "com.dataform.protos";
option java_outer_classname = "CoreMeta";
option java_multiple_files = true;

option go_package = "github.com/dataform-co/dataform/protos/dataform";

message JitExecutionRequest {
  oneof request {
    JitCompilationRequest compile = 1;
    JitAdhocQueryResponse adhoc_query_response = 2; 
  }
}

message JitExecutionResponse {
  oneof response {
    JitCompilationResponse compilation_response = 1;
    JitAdhocQueryRequest adhoc_query = 2;
  }
}

message JitCompilationRequest {
  string statement = 1;
  string project_dir = 2;
  ExecutionAction action = 3;
  google.protobuf.Struct jit_context_data = 4;
}

message JitCompilationResponse {
  oneof response {
    string query = 1;
    string compilation_error = 2;
  }
}

message JitAdhocQueryRequest {
  int32 query_id = 1;
  string query = 2;
}

message JitAdhocQueryResponse {
  int32 query_id = 1;
  oneof response {
    JitQueryExecutionResult result = 2;
    string execution_error = 3;
  }
}

message FieldSchema {
    string name = 1;
    string type = 2;
    repeated FieldSchema fields = 3;
}

message JitQueryExecutionResult {
    repeated JitQueryRow rows = 1;
    repeated FieldSchema fields = 2;
}

message JitQueryRow {
    google.protobuf.Struct row = 1;
}
